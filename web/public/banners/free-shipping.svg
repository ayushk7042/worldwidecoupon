<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="Free shipping with no minimum spend — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E9F6E" flood-opacity="0.22"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.18"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E9F6E" opacity="0.14"/>
    </pattern>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF7E9"/>
      <stop offset="55%" stop-color="#F5FBF7"/>
      <stop offset="100%" stop-color="#FFDCC7"/>
    </linearGradient>
    <linearGradient id="cta3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg3)"/>
  <rect width="1200" height="300" rx="28" fill="url(#dots)" opacity="0.4"/>

  <g filter="url(#blur)" opacity="0.6">
    <circle cx="1090" cy="250" r="130" fill="#FFFFFF"/>
    <circle cx="120" cy="20" r="100" fill="#FFFFFF"/>
  </g>

  <g transform="translate(60 46)">
    <rect width="200" height="34" rx="17" fill="#1F2937"/>
    <circle cx="20" cy="17" r="5.5" fill="#FFDCC7"/>
    <text x="36" y="22.5" font-size="13" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">THIS WEEK ONLY</text>

    <text x="0" y="90" font-size="44" font-weight="800" fill="#1F2937" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Free shipping,</text>
    <text x="0" y="138" font-size="44" font-weight="800" fill="#0E9F6E" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no minimum spend</text>

    <text x="0" y="173" font-size="17" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Delivery on the house at hundreds of stores.</text>

    <g transform="translate(0 192)" filter="url(#soft)">
      <rect width="218" height="54" rx="27" fill="url(#cta3)"/>
      <text x="109" y="34.5" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Browse the offers &#8594;</text>
    </g>

    <g transform="translate(238 199)">
      <text x="0" y="16" font-size="17" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
      <text x="0" y="34" font-size="10.5" font-weight="600" fill="#6B7280" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
    </g>
  </g>

  <g filter="url(#card)" transform="translate(880 66)">
    <rect x="0" y="34" width="206" height="150" rx="20" fill="url(#box)"/>
    <rect x="0" y="34" width="206" height="52" rx="20" fill="#FFDCC7"/>
    <rect x="88" y="34" width="30" height="150" fill="#22C55E" opacity="0.92"/>
    <circle cx="103" cy="60" r="17" fill="#0E9F6E"/>
    <text x="103" y="67" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">%</text>
    <text x="103" y="152" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ON US</text>
  </g>

  <g stroke="#22C55E" stroke-width="8" stroke-linecap="round" opacity="0.35">
    <path d="M700 132h96"/>
    <path d="M664 176h74"/>
    <path d="M716 220h70"/>
  </g>
</svg>
