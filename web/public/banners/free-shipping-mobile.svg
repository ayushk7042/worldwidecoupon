<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Free shipping with no minimum spend — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E9F6E" flood-opacity="0.22"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.18"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E9F6E" opacity="0.13"/>
    </pattern>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF7E9"/>
      <stop offset="55%" stop-color="#F5FBF7"/>
      <stop offset="100%" stop-color="#FFDCC7"/>
    </linearGradient>
    <linearGradient id="cta3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="26" fill="url(#bg3)"/>
  <rect width="800" height="400" rx="26" fill="url(#dots)" opacity="0.4"/>
  <g filter="url(#blur)" opacity="0.6">
    <circle cx="730" cy="350" r="120" fill="#FFFFFF"/>
    <circle cx="110" cy="20" r="96" fill="#FFFFFF"/>
  </g>

  <g transform="translate(48 48)">
    <rect width="212" height="38" rx="19" fill="#1F2937"/>
    <circle cx="22" cy="19" r="6" fill="#FFDCC7"/>
    <text x="40" y="25" font-size="14" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">THIS WEEK ONLY</text>
  </g>

  <text x="48" y="176" font-size="46" font-weight="800" fill="#1F2937" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Free shipping,</text>
  <text x="48" y="230" font-size="46" font-weight="800" fill="#0E9F6E" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no minimum</text>
  <text x="48" y="270" font-size="19" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Delivery on the house at 100s of stores.</text>

  <g transform="translate(48 292)" filter="url(#soft)">
    <rect width="232" height="54" rx="27" fill="url(#cta3)"/>
    <text x="116" y="34.5" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Browse the offers &#8594;</text>
  </g>

  <g filter="url(#card)" transform="translate(556 108)">
    <rect x="0" y="0" width="190" height="140" rx="20" fill="url(#box)"/>
    <rect x="0" y="0" width="190" height="48" rx="20" fill="#FFDCC7"/>
    <rect x="80" y="0" width="28" height="140" fill="#22C55E" opacity="0.92"/>
    <circle cx="94" cy="24" r="16" fill="#0E9F6E"/>
    <text x="94" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">%</text>
    <text x="94" y="112" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ON US</text>
  </g>

  <g transform="translate(752 62)">
    <text x="0" y="0" text-anchor="end" font-size="19" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="20" text-anchor="end" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
  </g>

</svg>
