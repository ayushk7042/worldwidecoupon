<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Exclusive codes you will not find elsewhere — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E9F6E" flood-opacity="0.25"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F2937" flood-opacity="0.2"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#0E9F6E" opacity="0.13"/>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3FDF7"/>
      <stop offset="50%" stop-color="#DFF7E9"/>
      <stop offset="100%" stop-color="#FCE7E9"/>
    </linearGradient>
    <linearGradient id="cta2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0B7D58"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="30" fill="url(#bg2)"/>
  <rect width="1200" height="400" rx="30" fill="url(#dots)" opacity="0.45"/>

  <g filter="url(#blur)" opacity="0.6">
    <circle cx="1000" cy="340" r="150" fill="#FFFFFF"/>
    <circle cx="240" cy="-20" r="120" fill="#FFFFFF"/>
  </g>

  <g transform="translate(64 62)">
    <rect width="196" height="38" rx="19" fill="#0E9F6E"/>
    <text x="24" y="25" font-size="14" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MEMBERS ONLY</text>
  </g>

  <text x="64" y="186" font-size="54" font-weight="800" fill="#1F2937" letter-spacing="-1.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Exclusive codes you</text>
  <text x="64" y="248" font-size="54" font-weight="800" fill="#0E9F6E" letter-spacing="-1.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">will not find elsewhere</text>
  <text x="64" y="292" font-size="19" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Negotiated for this site, not on the brand&#8217;s own page.</text>

  <g transform="translate(64 306)" filter="url(#soft)">
    <rect width="224" height="58" rx="29" fill="url(#cta2)"/>
    <text x="112" y="37" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">See exclusives &#8594;</text>
  </g>

  <g filter="url(#card)">
    <g transform="translate(724 96) rotate(-5)">
      <rect width="330" height="108" rx="24" fill="url(#chip)"/>
      <text x="30" y="42" font-size="13" font-weight="700" letter-spacing="1.8" fill="#8FE3B9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">EXCLUSIVE CODE</text>
      <text x="30" y="80" font-size="32" font-weight="800" letter-spacing="2.4" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WWC-EXTRA20</text>
      <circle cx="0" cy="54" r="13" fill="#DFF7E9"/>
      <circle cx="330" cy="54" r="13" fill="#FCE7E9"/>
    </g>

    <g transform="translate(902 236) rotate(6)">
      <rect width="166" height="64" rx="18" fill="#FFFFFF"/>
      <text x="83" y="41" text-anchor="middle" font-size="23" font-weight="800" fill="#D93E6B" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+20% OFF</text>
    </g>

  </g>

  <g transform="translate(1136 352)">
    <text x="0" y="0" text-anchor="end" font-size="21" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS. WORLDWIDE.</text>
  </g>

</svg>
