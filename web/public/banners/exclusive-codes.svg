<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Codes you will not find anywhere else — WorldwideCoupons">
  <defs>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0B3B2A" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="60%" stop-color="#0B3B2A"/>
      <stop offset="100%" stop-color="#0B7D58"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="30" fill="#F2FBF6"/>

  <g clip-path="inset(0 round 30)">
    <rect width="1200" height="400" fill="#F2FBF6"/>
    <path d="M0 0H520L420 400H0Z" fill="url(#panel2)"/>
    <circle cx="240" cy="60" r="150" fill="#22C55E" opacity="0.28" filter="url(#glow)"/>
    <circle cx="1040" cy="330" r="150" fill="#FCE7E9" opacity="0.9" filter="url(#glow)"/>
  </g>

  <g transform="translate(64 66)">
    <rect width="174" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="22" y="23" font-size="13" font-weight="700" letter-spacing="1.7" fill="#8FE3B9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MEMBERS ONLY</text>
  </g>

  <text x="64" y="188" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Codes you</text>
  <text x="64" y="240" font-size="46" font-weight="800" fill="#43CF86" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">will not find</text>
  <text x="64" y="292" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">anywhere else</text>

  <g transform="translate(560 96)" filter="url(#lift)">
    <rect width="420" height="140" rx="28" fill="url(#ticket)"/>
    <circle cx="0" cy="70" r="16" fill="#F2FBF6"/>
    <circle cx="420" cy="70" r="16" fill="#F2FBF6"/>
    <path d="M312 22v96" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="36" y="58" font-size="13" font-weight="700" letter-spacing="1.8" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">EXCLUSIVE CODE</text>
    <text x="36" y="98" font-size="30" font-weight="800" letter-spacing="1.6" fill="#0E9F6E" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WWC-EXTRA20</text>
    <text x="366" y="62" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">SAVE</text>
    <text x="366" y="96" text-anchor="middle" font-size="27" font-weight="800" fill="#10241C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">20%</text>
  </g>

  <g transform="translate(560 268)" filter="url(#lift)">
    <rect width="200" height="58" rx="29" fill="url(#cta)"/>
    <text x="100" y="37" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">See exclusives</text>
  </g>

  <g transform="translate(780 268)">
    <rect width="200" height="58" rx="29" fill="#FFFFFF" stroke="#DFF7E9" stroke-width="2"/>
    <text x="100" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0B7D58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Members save more</text>
  </g>

  <g transform="translate(1136 352)">
    <text x="0" y="0" text-anchor="end" font-size="20" font-weight="800" fill="#10241C" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="21" text-anchor="end" font-size="10.5" font-weight="600" fill="#6B7280" letter-spacing="1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS. WORLDWIDE.</text>
  </g>

</svg>
