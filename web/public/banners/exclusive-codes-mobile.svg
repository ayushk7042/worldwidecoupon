<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Exclusive codes, members first — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E9F6E" flood-opacity="0.22"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.18"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E9F6E" opacity="0.13"/>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF5"/>
      <stop offset="50%" stop-color="#DFF7E9"/>
      <stop offset="100%" stop-color="#FCE7E9"/>
    </linearGradient>
    <linearGradient id="cta2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0B7D58"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="26" fill="url(#bg2)"/>
  <rect width="800" height="400" rx="26" fill="url(#dots)" opacity="0.45"/>
  <g filter="url(#blur)" opacity="0.6">
    <circle cx="700" cy="330" r="120" fill="#FFFFFF"/>
    <circle cx="140" cy="10" r="100" fill="#FFFFFF"/>
  </g>

  <g transform="translate(48 48)">
    <rect width="196" height="38" rx="19" fill="#0E9F6E"/>
    <text x="24" y="25" font-size="14" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MEMBERS ONLY</text>
  </g>

  <text x="48" y="176" font-size="46" font-weight="800" fill="#1F2937" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Exclusive codes,</text>
  <text x="48" y="230" font-size="46" font-weight="800" fill="#0E9F6E" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">members first</text>
  <text x="48" y="270" font-size="19" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Not on the brand&#8217;s own page.</text>

  <g transform="translate(48 292)" filter="url(#soft)">
    <rect width="222" height="54" rx="27" fill="url(#cta2)"/>
    <text x="111" y="34.5" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">See exclusives &#8594;</text>
  </g>

  <g filter="url(#card)" transform="translate(500 96) rotate(-4)">
    <rect width="268" height="88" rx="20" fill="url(#chip)"/>
    <text x="26" y="36" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#8FE3B9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">EXCLUSIVE CODE</text>
    <text x="26" y="66" font-size="26" font-weight="800" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WWC-EXTRA20</text>
    <circle cx="0" cy="44" r="11" fill="#DFF7E9"/>
    <circle cx="268" cy="44" r="11" fill="#FCE7E9"/>
  </g>

  <g filter="url(#card)" transform="translate(596 212) rotate(6)">
    <rect width="150" height="56" rx="16" fill="#FFFFFF"/>
    <text x="75" y="36" text-anchor="middle" font-size="21" font-weight="800" fill="#D93E6B" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+20% OFF</text>
  </g>

  <g transform="translate(752 62)">
    <text x="0" y="0" text-anchor="end" font-size="19" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="20" text-anchor="end" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
  </g>

</svg>
