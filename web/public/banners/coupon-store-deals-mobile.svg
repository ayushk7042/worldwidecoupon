<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Real savings, not stale codes — WorldwideCoupons">
  <defs>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B3B2A" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06301F"/>
      <stop offset="55%" stop-color="#0B5B3E"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6F9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="30" fill="#FFF6F2"/>
  <g clip-path="inset(0 round 30)">
    <circle cx="710" cy="60" r="150" fill="#DFF7E9" opacity="0.9" filter="url(#glow)"/>
    <circle cx="70" cy="400" r="120" fill="#FFE7E2" opacity="0.9" filter="url(#glow)"/>
  </g>
  <g transform="translate(48 40)">
    <rect width="170" height="34" rx="17" fill="#10241C"/>
    <circle cx="19" cy="17" r="4.5" fill="#43CF86"/>
    <text x="34" y="22.5" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">COUPON STORE</text>
  </g>
  <text x="48" y="144" font-size="42" font-weight="800" fill="#10241C" text-anchor="start" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Real savings,</text>
  <text x="48" y="192" font-size="42" font-weight="800" fill="#0E9F6E" text-anchor="start" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">not stale codes</text>
  <text x="48" y="228" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start" letter-spacing="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Checked before they go live.</text>
  <g transform="translate(48 244)">
    <rect width="124" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.1"/>
    <circle cx="15" cy="16" r="4" fill="#0E9F6E"/>
    <text x="26" y="21" font-size="12.5" font-weight="700" fill="#0B7D58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1,700+ offers</text>
  </g>
  <g transform="translate(181.7 244)">
    <rect width="110" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.1"/>
    <circle cx="15" cy="16" r="4" fill="#0E9F6E"/>
    <text x="26" y="21" font-size="12.5" font-weight="700" fill="#0B7D58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">190+ brands</text>
  </g>
  <g transform="translate(48 290)" filter="url(#lift)">
    <rect width="209" height="48" rx="24" fill="url(#cta)"/>
    <text x="104" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Browse the offers</text>
  </g>
  <g transform="translate(468 64)" filter="url(#lift)">
    <rect width="290" height="104" rx="24" fill="url(#card)"/>
    <rect x="24" y="19" width="88" height="66" rx="18" fill="#0E9F6E"/>
    <text x="68" y="61" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">50%</text>
    <text x="128" y="44" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">TODAY&#8217;S BEST</text>
    <text x="128" y="72" font-size="21" font-weight="800" fill="#10241C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">190 brands</text>
  </g>
  <g transform="translate(752 358)">
    <text x="0" y="0" text-anchor="end" font-size="20" font-weight="800" fill="#10241C" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="20" text-anchor="end" font-size="10.5" font-weight="600" fill="#6B7280" fill-opacity="1" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
  </g>
</svg>
