<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Real savings, not stale codes — WorldwideCoupons">
  <defs>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B3B2A" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06301F"/>
      <stop offset="55%" stop-color="#0B5B3E"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="30" fill="#FFF6F2"/>
  <g clip-path="inset(0 round 30)">
    <path d="M624 0H1200V400H504Z" fill="url(#panel)"/>
    <circle cx="1056" cy="60" r="150" fill="#22C55E" opacity="0.32" filter="url(#glow)"/>
  </g>
  <g transform="translate(64 54)">
    <rect width="170" height="34" rx="17" fill="#10241C"/>
    <circle cx="19" cy="17" r="4.5" fill="#43CF86"/>
    <text x="34" y="22.5" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">COUPON STORE</text>
  </g>
  <text x="64" y="166" font-size="50" font-weight="800" fill="#10241C" text-anchor="start" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Real savings,</text>
  <text x="64" y="222" font-size="50" font-weight="800" fill="#0E9F6E" text-anchor="start" letter-spacing="-1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">not stale codes</text>
  <text x="64" y="262" font-size="17" font-weight="500" fill="#4B5563" text-anchor="start" letter-spacing="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Every offer opened and checked before it goes live.</text>
  <g transform="translate(64 280)">
    <rect width="158" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.1"/>
    <circle cx="15" cy="16" r="4" fill="#0E9F6E"/>
    <text x="26" y="21" font-size="12.5" font-weight="700" fill="#0B7D58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1,700+ live offers</text>
  </g>
  <g transform="translate(232.2 280)">
    <rect width="110" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.1"/>
    <circle cx="15" cy="16" r="4" fill="#0E9F6E"/>
    <text x="26" y="21" font-size="12.5" font-weight="700" fill="#0B7D58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">190+ brands</text>
  </g>
  <g transform="translate(64 322)" filter="url(#lift)">
    <rect width="219" height="50" rx="25" fill="url(#cta)"/>
    <text x="110" y="31" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Browse the offers</text>
  </g>
  <g transform="translate(700 92)" filter="url(#lift)">
