<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Save on 190 plus brands every day — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E9F6E" flood-opacity="0.25"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F2937" flood-opacity="0.2"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#0E9F6E" opacity="0.13"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4F0"/>
      <stop offset="45%" stop-color="#FFE7E2"/>
      <stop offset="100%" stop-color="#DFF7E9"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43CF86"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="30" fill="url(#dots)" opacity="0.5"/>

  <g filter="url(#blur)" opacity="0.6">
    <circle cx="1060" cy="40" r="140" fill="#FFFFFF"/>
    <circle cx="120" cy="400" r="120" fill="#FFFFFF"/>
  </g>

  <g transform="translate(64 62)">
    <rect width="224" height="38" rx="19" fill="#1F2937"/>
    <circle cx="22" cy="19" r="6" fill="#22C55E"/>
    <text x="40" y="25" font-size="14" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">COUPON STORE</text>
  </g>

  <text x="64" y="186" font-size="54" font-weight="800" fill="#1F2937" letter-spacing="-1.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Save on 190+ brands,</text>
  <text x="64" y="248" font-size="54" font-weight="800" fill="#0E9F6E" letter-spacing="-1.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">every single day</text>
  <text x="64" y="292" font-size="19" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Hand-checked promo codes. No dead links, no fake timers.</text>

  <g transform="translate(64 306)" filter="url(#soft)">
    <rect width="252" height="58" rx="29" fill="url(#cta)"/>
    <text x="126" y="37" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Grab today&#8217;s deals &#8594;</text>
  </g>

  <g transform="translate(930 208)">
    <ellipse cx="0" cy="0" rx="150" ry="62" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" transform="rotate(-24)" opacity="0.4"/>
    <circle cx="0" cy="0" r="96" fill="url(#globe)" filter="url(#soft)"/>
    <g fill="#EAFBF1" opacity="0.92">
      <path d="M-57 -30c15-10 30-5 40 6s-6 19-24 19-30 0-34-10 7-9 18-15Z"/>
      <path d="M-9 17c19-10 40 0 45 15s-10 30-24 24-30-15-30-24 5-10 9-15Z"/>
      <path d="M33 -49c15 0 30 10 30 19s-15 15-24 10-19-10-19-19 5-10 13-10Z"/>
    </g>
  </g>

  <g filter="url(#card)">
    <g transform="translate(618 74) rotate(-7)">
      <rect width="214" height="80" rx="20" fill="#FFFFFF"/>
      <circle cx="0" cy="40" r="11" fill="#FFE7E2"/>
      <circle cx="214" cy="40" r="11" fill="#DFF7E9"/>
      <text x="26" y="34" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FLAT DISCOUNT</text>
      <text x="26" y="63" font-size="27" font-weight="800" fill="#0E9F6E" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">50% OFF</text>
    </g>

    <g transform="translate(640 286) rotate(5)">
      <rect width="228" height="62" rx="18" fill="#1F2937"/>
      <circle cx="34" cy="31" r="13" fill="#22C55E"/>
      <text x="34" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#06281C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">%</text>
      <text x="60" y="37" font-size="16.5" font-weight="700" letter-spacing="0.6" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FREE SHIPPING</text>
    </g>
  </g>

  <g fill="#22C55E" opacity="0.5">
    <circle cx="572" cy="210" r="5"/>
    <circle cx="600" cy="176" r="3"/>
    <circle cx="590" cy="252" r="3.6"/>
  </g>

  <g transform="translate(1136 352)">
    <text x="0" y="0" text-anchor="end" font-size="21" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
    <text x="0" y="22" text-anchor="end" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS. WORLDWIDE.</text>
  </g>

</svg>
