<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="Save on 190 plus brands every day — WorldwideCoupons">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E9F6E" flood-opacity="0.22"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.18"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E9F6E" opacity="0.14"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1EC"/>
      <stop offset="45%" stop-color="#FFE7E2"/>
      <stop offset="100%" stop-color="#DFF7E9"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E9F6E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43CF86"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0E9F6E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#dots)" opacity="0.5"/>

  <g filter="url(#blur)" opacity="0.55">
    <circle cx="1040" cy="40" r="120" fill="#FFFFFF"/>
    <circle cx="150" cy="300" r="110" fill="#FFFFFF"/>
    <circle cx="700" cy="20" r="80" fill="#DFF7E9"/>
  </g>

  <g transform="translate(60 44)">
    <rect width="206" height="34" rx="17" fill="#1F2937"/>
    <circle cx="20" cy="17" r="5.5" fill="#22C55E"/>
    <text x="36" y="22.5" font-size="13" font-weight="700" letter-spacing="1.8" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">COUPON STORE</text>

    <text x="0" y="88" font-size="44" font-weight="800" fill="#1F2937" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Save on 190+ brands,</text>
    <text x="0" y="136" font-size="44" font-weight="800" fill="url(#headline)" letter-spacing="-1.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">every single day</text>

    <text x="0" y="171" font-size="17" font-weight="500" fill="#4B5563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Hand-checked promo codes. No dead links, no fake timers.</text>

    <g transform="translate(0 190)" filter="url(#soft)">
      <rect width="232" height="54" rx="27" fill="url(#cta)"/>
      <text x="116" y="34.5" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Grab today&#8217;s deals &#8594;</text>
    </g>

    <g transform="translate(252 197)">
      <text x="0" y="16" font-size="17" font-weight="800" fill="#1F2937" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#0E9F6E">Coupons</tspan></text>
      <text x="0" y="34" font-size="10.5" font-weight="600" fill="#6B7280" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
    </g>
  </g>

  <g transform="translate(902 150)">
    <ellipse cx="0" cy="0" rx="132" ry="56" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" transform="rotate(-24)" opacity="0.45"/>
    <circle cx="0" cy="0" r="84" fill="url(#globe)" filter="url(#soft)"/>
    <g fill="#EAFBF1" opacity="0.92">
      <path d="M-50 -26c13-9 26-4 35 5s-5 17-21 17-26 0-30-9 6-8 16-13Z"/>
      <path d="M-8 15c17-9 35 0 39 13s-9 26-21 21-26-13-26-21 4-9 8-13Z"/>
      <path d="M29 -43c13 0 26 9 26 17s-13 13-21 9-17-9-17-17 4-9 12-9Z"/>
    </g>
  </g>

  <g filter="url(#card)">
    <g transform="translate(606 38) rotate(-7)">
      <rect width="196" height="70" rx="18" fill="#FFFFFF"/>
      <circle cx="0" cy="35" r="10" fill="#FFE7E2"/>
      <circle cx="196" cy="35" r="10" fill="#DFF7E9"/>
      <text x="24" y="30" font-size="11" font-weight="700" letter-spacing="1.3" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FLAT DISCOUNT</text>
      <text x="24" y="55" font-size="24" font-weight="800" fill="#0E9F6E" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">50% OFF</text>
    </g>

    <g transform="translate(640 198) rotate(5)">
      <rect width="210" height="58" rx="16" fill="#1F2937"/>
      <circle cx="32" cy="29" r="12" fill="#22C55E"/>
      <text x="32" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="#06281C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">%</text>
      <text x="56" y="34" font-size="15.5" font-weight="700" letter-spacing="0.6" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FREE SHIPPING</text>
    </g>
  </g>

  <g fill="#22C55E" opacity="0.55">
    <circle cx="556" cy="150" r="4"/>
    <circle cx="584" cy="124" r="2.6"/>
    <circle cx="574" cy="182" r="3"/>
  </g>
</svg>
