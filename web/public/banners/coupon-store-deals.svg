    <rect x="24" y="28" width="88" height="66" rx="18" fill="#0E9F6E"/>
    <text x="68" y="70" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">50%</text>
    <text x="128" y="53" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">TODAY&#8217;S BEST</text>
    <text x="128" y="81" font-size="21" font-weight="800" fill="#10241C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Across 190 brands</text>
  </g>
  <g transform="translate(700 246)" filter="url(#lift)">
    <rect width="286" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <circle cx="28" cy="28" r="16" fill="#22C55E"/>
    <path d="M21 28l5 5 9-10" fill="none" stroke="#06281C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="33" font-size="15" font-weight="700" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Checked by an editor</text>
  </g>
  <g transform="translate(1136 354)">
    <text x="0" y="0" text-anchor="end" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Worldwide<tspan fill="#8FE3B9">Coupons</tspan></text>
    <text x="0" y="20" text-anchor="end" font-size="10.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="1.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">BETTER DEALS. BIGGER SAVINGS.</text>
