name: CI & Deploy

# Every push and PR gets the CI job (install, typecheck, build — both apps).
# Only a push to main additionally runs the deploy job, which SSHes into the
# production server and rolls out that build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin.worldwidecoupons.com, worldwidecoupons.com]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and roll out
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # A dedicated deploy key, installed on the server for this pipeline
          # only — see DEPLOY.md for how it was generated and installed.
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          # The server is CloudPanel: each app is its own Linux user with its
          # own home, its own pm2 daemon, and nginx already pointed at its
          # port. This root session pulls the code into a shared staging
          # clone, hands each app's own files to its own user (never
          # touching .env, which only ever exists on the server), then asks
          # that user's own pm2 to rebuild and reload — so a deploy can never
          # reach outside these two apps into any other site on the box.
          script: |
            set -e
            cd /root/wwc-src
            git fetch origin main
            git reset --hard origin/main

            rsync -a --exclude='.git' --exclude='.env' --exclude='.env.local' \
              admin.worldwidecoupons.com/ /home/worldwidecoupons-admin/htdocs/admin.worldwidecoupons.com/
            rsync -a --exclude='.git' --exclude='.env' --exclude='.env.local' \
              worldwidecoupons.com/ /home/worldwidecoupons/htdocs/worldwidecoupons.com/

            chown -R worldwidecoupons-admin:worldwidecoupons-admin /home/worldwidecoupons-admin/htdocs/admin.worldwidecoupons.com
            chown -R worldwidecoupons:worldwidecoupons /home/worldwidecoupons/htdocs/worldwidecoupons.com

            su - worldwidecoupons-admin -c 'cd htdocs/admin.worldwidecoupons.com && npm ci && npm run build && pm2 reload admin-worldwidecoupons'
            su - worldwidecoupons -c 'cd htdocs/worldwidecoupons.com && npm ci && npm run build && pm2 reload worldwidecoupons-web'
